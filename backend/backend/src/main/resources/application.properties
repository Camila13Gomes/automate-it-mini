spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/automateit}
spring.datasource.username=${DB_USERNAME:automateit}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8081}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.bootstrap.admin-username=${ADMIN_USERNAME:admin}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-display-name=${ADMIN_DISPLAY_NAME:Administrator}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=8h
